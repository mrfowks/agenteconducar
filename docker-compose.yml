services:
  # ===== Base de datos del agente Conducar =====
  postgres:
    image: postgres:16-alpine
    container_name: conducar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: conducar
      POSTGRES_PASSWORD: conducar
      POSTGRES_DB: conducar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conducar -d conducar"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Agente Conducar (app + panel + webhook) =====
  app:
    build: .
    container_name: conducar-agent
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://conducar:conducar@postgres:5432/conducar?schema=public
      PORT: 3000
      TZ: America/Lima
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./public:/app/public
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
