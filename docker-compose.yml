services:
  # ===== Base de datos del agente Conducar =====
  postgres:
    image: postgres:16-alpine
    container_name: conducar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: conducar
      POSTGRES_PASSWORD: conducar
      POSTGRES_DB: conducar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conducar -d conducar"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Agente Conducar (app + panel + webhook) =====
  app:
    build: .
    container_name: conducar-agent
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://conducar:conducar@postgres:5432/conducar?schema=public
      EVOLUTION_API_URL: http://evolution-api:8080
      PORT: 3000
      TZ: America/Lima
    ports:
      - "3000:3000"
    volumes:
      - ./public:/app/public

  # ===== Base de datos de Evolution API =====
  evolution-db:
    image: postgres:15
    container_name: conducar-evolution-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution123
    command:
      - postgres
      - -c
      - max_connections=1000
      - -c
      - listen_addresses=*
    volumes:
      - evolution-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Redis de Evolution API =====
  evolution-redis:
    image: redis:7-alpine
    container_name: conducar-evolution-redis
    restart: unless-stopped
    command: redis-server --port 6379 --appendonly yes
    volumes:
      - evolution-redis:/data

  # ===== Evolution API (pasarela WhatsApp) =====
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: conducar-evolution
    restart: unless-stopped
    depends_on:
      evolution-db:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution123@evolution-db:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_exchange
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      WEBHOOK_GLOBAL_ENABLED: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "true"
      WEBHOOK_EVENTS_SEND_MESSAGE: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_REQUEST_TIMEOUT_MS: "60000"
      WEBHOOK_RETRY_MAX_ATTEMPTS: "10"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - evolution-instances:/evolution/instances

volumes:
  pgdata:
  evolution-db:
  evolution-redis:
  evolution-instances:
