# =============================================================================
# docker-image.yml — Build + push de la imagen del agente a GHCR (ghcr.io)
#
# ALCANCE (FASE 3):
#   - Se dispara en cada push a main (y manualmente con workflow_dispatch).
#   - Construye la imagen multi-stage y la publica en
#     ghcr.io/mrfowks/agenteconducar.
#   - Tags: `sha-<corto>` (reproducible) + `latest` solo en la rama principal.
#
# FUERA DE ALCANCE (NO se hace aquí de forma intencional):
#   - NO hace deploy, NO usa SSH, NO toca ningún servidor/VPS.
#   - NO ejecuta migraciones (corren en el CMD del contenedor al arrancar).
#   - NO prueba contra Chatwoot/Meta reales.
# =============================================================================

name: docker-image-github-packages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag reproducible por commit (7 chars): ghcr.io/...:sha-abc1234
            type=sha,format=short
            # latest SOLO en la rama default (main): alias de despliegue estable
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max